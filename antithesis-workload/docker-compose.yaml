# Docker Compose configuration for Antithesis functional test workload
#
# This setup creates:
# - 8 bitcoind node containers (node0-node7)
# - 1 test harness container (tester)
# - A shared network for inter-container communication
# - A shared volume for data directories
#
# Usage:
#   # Build images first
#   docker compose build --build-arg TEST_NAME=example_test
#
#   # Run the test
#   docker compose up
#
#   # Clean up
#   docker compose down -v

services:
  # Bitcoin node containers (8 nodes)
  node0:
    build:
      context: .
      dockerfile: Dockerfile.bitcoind
      args:
        OWNER: ${OWNER:-bitcoin}
        REPO: ${REPO:-bitcoin}
        BRANCH: ${BRANCH:-master}
    image: bitcoin-test:latest
    container_name: node0
    hostname: node0
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    healthcheck:
      test: ["CMD", "pgrep", "-x", "bitcoind", "||", "true"]
      interval: 5s
      timeout: 3s
      retries: 3

  node1:
    image: bitcoin-test:latest
    container_name: node1
    hostname: node1
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node2:
    image: bitcoin-test:latest
    container_name: node2
    hostname: node2
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node3:
    image: bitcoin-test:latest
    container_name: node3
    hostname: node3
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node4:
    image: bitcoin-test:latest
    container_name: node4
    hostname: node4
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node5:
    image: bitcoin-test:latest
    container_name: node5
    hostname: node5
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node6:
    image: bitcoin-test:latest
    container_name: node6
    hostname: node6
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  node7:
    image: bitcoin-test:latest
    container_name: node7
    hostname: node7
    volumes:
      - shared-data:/data
    networks:
      - bitcoin-test-net
    depends_on:
      - node0

  # Test harness container
  tester:
    build:
      context: .
      dockerfile: Dockerfile.tester
      args:
        OWNER: ${OWNER:-dergoegge}
        REPO: ${REPO:-bitcoin}
        BRANCH: ${BRANCH:-containers}
        TEST_NAME: ${TEST_NAME:-example_test}
    image: bitcoin-tester:latest
    container_name: tester
    hostname: tester
    volumes:
      - shared-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bitcoin-test-net
    depends_on:
      - node0
      - node1
      - node2
      - node3
      - node4
      - node5
      - node6
      - node7
    environment:
      - P2P_LISTEN_ADDR=0.0.0.0
      - TEST_NAME=${TEST_NAME:-example_test}

networks:
  bitcoin-test-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  shared-data:
    driver: local
